name: Refresh public portfolio metadata
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: portfolio-metadata
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --experimental-strip-types scripts/sync-projects.ts
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Save generated snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/initial-projects.json
          git diff --staged --quiet || git commit -m 'data: refresh public portfolio metadata'
          git push
